<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASELL.COM | لوحة تحكم السائق</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(18, 24, 38, 0.95);
            --logo-yellow: #f8db1f;
            --logo-black: #0d1217;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-glow: rgba(248, 219, 31, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; transition: all 0.25s ease; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
        }

        .portal-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            border: 1px solid var(--border-glow);
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
        }

        .header h2 { color: var(--logo-yellow); font-size: 20px; font-weight: 900; margin-bottom: 6px; }
        .header p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

        .form-group { text-align: right; margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 800; color: var(--logo-yellow); margin-bottom: 6px; }

        input, select {
            width: 100%; padding: 12px 14px; border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; font-size: 14px; background: rgba(0, 0, 0, 0.5); color: #fff; outline: none;
        }
        input:focus, select:focus { border-color: var(--logo-yellow); box-shadow: 0 0 12px rgba(248, 219, 31, 0.3); }

        .btn-primary {
            background: linear-gradient(135deg, var(--logo-yellow), #e0c21a);
            color: var(--logo-black); border: none; padding: 14px; width: 100%;
            border-radius: 12px; font-weight: 900; font-size: 15px; cursor: pointer;
            box-shadow: 0 0 15px rgba(248, 219, 31, 0.3); margin-top: 10px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(248, 219, 31, 0.5); }

        .status-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
        .status-btn {
            padding: 12px 6px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); color: #fff; cursor: pointer; font-size: 12px; font-weight: 800;
        }
        .status-btn.online.active { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #22c55e; }
        .status-btn.busy.active { background: rgba(255, 204, 0, 0.2); border-color: #ffcc00; color: #ffcc00; }
        .status-btn.offline.active { background: rgba(255, 77, 77, 0.2); border-color: #ff4d4d; color: #ff4d4d; }

        .driver-badge-info {
            background: rgba(248, 219, 31, 0.08); border: 1px solid rgba(248, 219, 31, 0.3);
            border-radius: 14px; padding: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; text-align: right;
        }
        .driver-avatar-lg { font-size: 32px; }

        .logout-link {
            display: inline-block; margin-top: 18px; color: #ff4d4d; font-size: 12px;
            font-weight: 700; cursor: pointer; text-decoration: underline;
        }

        #loginSection, #dashboardSection { display: none; }
    </style>
</head>
<body>

<div class="portal-card">
    <div class="header">
        <h2>🛵 بوابة سائقي واصل الأغواط</h2>
        <p>تحديث الحالة والمنطقة في الوقت المباشر</p>
    </div>

    <!-- 🔒 شاشة تسجيل الدخول (تظهر فقط أول مرة) -->
    <div id="loginSection">
        <div class="form-group">
            <label>🔑 أدخل رمز PIN الخاص بك</label>
            <input type="password" id="pinInput" placeholder="أدخل الرمز السرّي..." maxlength="6">
        </div>
        <button class="btn-primary" onclick="loginDriver()">دخول البوابة 🚀</button>
    </div>

    <!-- ⚡ لوحة تحكم السائق (تبقى مسجلة دائماً ولا تخرج أبداً) -->
    <div id="dashboardSection">
        <div class="driver-badge-info">
            <div class="driver-avatar-lg" id="driverAvatar">👨‍✈️</div>
            <div>
                <h3 id="driverName" style="color: #fff; font-size: 16px; font-weight: 900;">-</h3>
                <p style="color: var(--text-muted); font-size: 12px;" id="driverCurrentZoneDisplay">📍 -</p>
            </div>
        </div>

        <div class="form-group">
            <label>🟢 تفعيل الحالة الآن</label>
            <div class="status-options">
                <button class="status-btn online" onclick="setStatus('online')">🟢 متوفر</button>
                <button class="status-btn busy" onclick="setStatus('busy')">🟡 مشغول</button>
                <button class="status-btn offline" onclick="setStatus('offline')">🔴 غائب</button>
            </div>
        </div>

        <div class="form-group" style="margin-top: 18px;">
            <label>📍 تحديث مكان التواجد (الحي)</label>
            <select id="driverZoneSelect" onchange="updateZone(this.value)">
                <option value="المعمورة">المعمورة</option>
                <option value="الوئام">الوئام</option>
                <option value="محافير">محافير</option>
                <option value="العدل">العدل</option>
                <option value="لاديوان">لاديوان</option>
                <option value="زرقلان">زرقلان</option>
                <option value="حي 250 سكن">حي 250 سكن</option>
                <option value="حي المجاهدين">حي المجاهدين</option>
                <option value="بن سحنون">بن سحنون</option>
                <option value="المقطع القبلي">المقطع القبلي</option>
                <option value="وسط المدينة">وسط المدينة</option>
            </select>
        </div>

        <div class="form-group">
            <label>📦 عدد الطلبات الناجحة المكتملة</label>
            <input type="number" id="orderCountInput" min="0" placeholder="0">
        </div>

        <button class="btn-primary" onclick="saveDriverStatusData()">حفظ وتحديث مباشر 🔄</button>
        
        <br>
        <span class="logout-link" onclick="logoutDriver()">تسجيل الخروج من هذا الجهاز</span>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz674jmMM4X8gZk9A_g0ZptClW7RYdf51_4N5_2j--G4MNCD-OX_tw2bsoC2neHPG36lw/exec";

    // 🔑 قاعدة بيانات السائقين وأكواد الـ PIN الخاصة بهم
    const driversDb = {
        "1234": { id: "d1", name: "أيوب", zone: "المعمورة", avatar: "👨‍✈️" },
        "5678": { id: "d2", name: "نوح", zone: "المعمورة", avatar: "🛵" },
        "9999": { id: "d3", name: "أيوب الوئام", zone: "الوئام", avatar: "⚡" }
    };

    let currentDriverKey = null;
    let currentStatus = 'online';

    // 🔄 أول ما يفتح السائق الصفحة، نتحقق إن كان مسجلاً مسبقاً (ليبقى مسجلاً دائماً ولا يخرج)
    window.onload = function() {
        const savedPin = localStorage.getItem('wasell_driver_saved_pin');
        if (savedPin && driversDb[savedPin]) {
            showDashboard(savedPin);
        } else {
            document.getElementById('loginSection').style.display = 'block';
        }
    };

    function loginDriver() {
        const pin = document.getElementById('pinInput').value.trim();
        if (driversDb[pin]) {
            // 💾 حفظ الرمز في المتصفح للأبد لكي لا يخرج أبداً عند إعادة الدخول
            localStorage.setItem('wasell_driver_saved_pin', pin);
            showDashboard(pin);
        } else {
            alert("❌ رمز PIN غير صحيح، يرجى المحاولة مجدداً!");
        }
    }

    function showDashboard(pin) {
        currentDriverKey = pin;
        const driver = driversDb[pin];
        
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';

        document.getElementById('driverName').innerText = driver.name;
        document.getElementById('driverAvatar').innerText = driver.avatar;
        document.getElementById('driverCurrentZoneDisplay').innerText = `📍 متواجد في: ${driver.zone}`;
        document.getElementById('driverZoneSelect').value = driver.zone;

        setStatus('online');
    }

    function setStatus(statusStr) {
        currentStatus = statusStr;
        document.querySelectorAll('.status-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.status-btn.${statusStr}`).classList.add('active');
    }

    function updateZone(newZone) {
        document.getElementById('driverCurrentZoneDisplay').innerText = `📍 متواجد في: ${newZone}`;
    }

    async function saveDriverStatusData() {
        if (!currentDriverKey) return;
        const driver = driversDb[currentDriverKey];
        const newZone = document.getElementById('driverZoneSelect').value;
        const ordersCount = document.getElementById('orderCountInput').value;

        const payload = {
            action: "updateDriverStatus",
            driverKey: driver.id,
            status: currentStatus,
            zone: newZone,
            orders: ordersCount ? parseInt(ordersCount) : undefined
        };

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            alert("✅ تم تحديث حالتك وموقعك بنجاح في Google Sheets والموقع الرئيسي!");
        } catch(e) {
            alert("⚠️ حدث خطأ أثناء التحديث، تأكد من الاتصال بالإنترنت.");
        }
    }

    function logoutDriver() {
        if (confirm("هل أنت متأكد من تسجيل الخروج من هذا الجهاز؟")) {
            localStorage.removeItem('wasell_driver_saved_pin');
            location.reload();
        }
    }
</script>
</body>
</html>
